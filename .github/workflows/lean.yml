name: Lean verification

on:
  push:
    branches:
      - "main"
      - "formalization/**"
    paths:
      - "**/*.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.lean"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject proof placeholders
        shell: bash
        run: |
          if grep -R -n -E '\b(sorry|admit)\b' --include='*.lean' Allender Allender.lean; then
            echo "Lean proof placeholders are not allowed."
            exit 1
          fi

      - name: Install elan and pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Restore dependency sources
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lean-packages-${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}

      - name: Verify pinned dependencies
        run: lake update

      - name: Download mathlib build cache
        run: lake exe cache get

      - name: Build project
        run: lake build

      - name: Compile axiom audit
        run: lake env lean Allender/AxiomAudit.lean

      - name: Independently check Lean environment
        run: lake env leanchecker Allender
