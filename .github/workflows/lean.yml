name: Lean verification

# A green run validates the Lean declarations present on this branch; it does
# not certify manuscript claims that have not yet been formalized.
# The reported commit SHA must equal the branch head being claimed as verified.

on:
  workflow_dispatch:
  push:
    branches:
      - formalization/canonical-components-v2
  pull_request:
    branches:
      - main
      - formalization/full-reduction-v1
    paths:
      - 'Allender/**'
      - 'Allender.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject proof placeholders
        shell: bash
        run: |
          if grep -R -n -E '\b(sorry|admit)\b' --include='*.lean' Allender Allender.lean; then
            echo "Lean proof placeholders are not allowed."
            exit 1
          fi

      - name: Install elan and pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Restore Lake workspace cache
        uses: actions/cache@v4
        with:
          path: .lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}

      - name: Generate Lake manifest
        run: lake update

      - name: Download mathlib build cache
        run: lake exe cache get

      - name: Build, audit, and independently replay the project
        run: bash scripts/verify-lean.sh
