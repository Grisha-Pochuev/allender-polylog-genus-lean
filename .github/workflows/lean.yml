name: Lean verification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject proof placeholders
        shell: bash
        run: |
          if grep -R -n -E '\b(sorry|admit)\b' --include='*.lean' Allender Allender.lean; then
            echo "Lean proof placeholders are not allowed."
            exit 1
          fi

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          leanchecker: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Generate Lake manifest
        run: lake update

      - name: Download mathlib build cache
        run: lake exe cache get

      - name: Build project
        run: lake build

      - name: Compile axiom audit
        run: lake env lean Allender/AxiomAudit.lean

      - name: Independently check Lean environment
        run: lake env leanchecker
